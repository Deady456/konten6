name: Long-Form Documentary Pipeline (Reka Kuno)

on:
  workflow_dispatch:
    inputs:
      upload_to_youtube:
        description: 'Upload video to YouTube automatically?'
        type: boolean
        required: true
        default: true
      enable_dubbing:
        description: 'Generate Sulih Suara (dubbing) track?'
        type: boolean
        required: true
        default: true
      dub_lang:
        description: 'Target language for Sulih Suara'
        type: choice
        options:
          - en
          - es
          - ar
          - ja
        default: 'en'
        required: true
      use_subtitles:
        description: 'Burn-in subtitles into video? (Default: false = clean frame)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  # =========================================================================
  # STAGE 1: ASSET GENERATION (Script, Voiceover, Batch Images, Thumbnail)
  # =========================================================================
  stage1_prepare_assets:
    name: "Stage 1: Generate Script, Voice & Batch Images"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env configuration
        env:
          ALL_SECRETS: ${{ toJson(secrets) }}
        run: |
          python - <<'PY'
          import os, json
          secrets = json.loads(os.environ.get('ALL_SECRETS','{}'))
          prefixes = ('GROQ_API_KEY', 'GEMINI_API_KEY', 'PEXELS_API_KEY', 'PIXABAY_API_KEY', 'SAMBANOVA_API_KEY', 'NINEROUTER')
          explicit = {
              'ELEVENLABS_API_KEYS', 'CLOUDFLARE_ACCOUNT_ID', 'CLOUDFLARE_API_TOKEN',
              'TOKEN_B64', 'CLIENT_SECRET_B64', 'PAT_TOKEN', 'PEXELS_API_KEY', 'PIXABAY_API_KEY', 'SAMBANOVA_API_KEY',
              'NINEROUTER_API_KEY', 'NINEROUTER_KEY', 'NINEROUTER_URL', 'OMNIROUTE_API_KEY', 'SHELLSHOCK_URL', 'SHELLSHOCK_API_KEY'
          }
          with open('.env', 'w') as f:
              for k, v in secrets.items():
                  if any(k.startswith(p) for p in prefixes) or k in explicit:
                      v_escaped = v.replace('\n','\\n') if isinstance(v, str) else str(v)
                      f.write(f'{k}="{v_escaped}"\n')
          print('Wrote .env file successfully')
          PY

      - name: Run Stage 1 (Generate All Assets & Thumbnail)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_PROVIDER: groq
        run: |
          ARGS="--out-zip output/bundle.zip"
          if [ "${{ inputs.use_subtitles }}" == "true" ]; then
            ARGS="$ARGS --subtitles"
          fi
          echo "Executing Stage 1: python -m src.stage1_assets $ARGS"
          python -m src.stage1_assets $ARGS

      - name: Upload Assets Bundle Artifact (1-Day Retention)
        uses: actions/upload-artifact@v4
        with:
          name: documentary-assets-bundle
          path: output/bundle.zip
          retention-days: 1
          if-no-files-found: error

  # =========================================================================
  # STAGE 2: RENDER & PUBLISH (Multi-Camera Cuts, Dubbing, YouTube Studio)
  # =========================================================================
  stage2_render_and_upload:
    name: "Stage 2: Render Multi-Cut Video & Upload"
    needs: stage1_prepare_assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            /usr/bin/ffmpeg
            /usr/bin/ffprobe
            /usr/lib/x86_64-linux-gnu/libav*
            /usr/lib/x86_64-linux-gnu/libsw*
            /usr/lib/x86_64-linux-gnu/libpostproc*
          key: ffmpeg-${{ runner.os }}-v2

      - name: Install FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decode YouTube credentials
        run: |
          if [ -n "${{ secrets.CLIENT_SECRET_B64 }}" ]; then
            echo "${{ secrets.CLIENT_SECRET_B64 }}" | base64 -d > client_secret.json
          fi
          if [ -n "${{ secrets.TOKEN_B64 }}" ]; then
            echo "${{ secrets.TOKEN_B64 }}" | base64 -d > token_default.json
          fi

      - name: Create .env configuration
        env:
          ALL_SECRETS: ${{ toJson(secrets) }}
        run: |
          python - <<'PY'
          import os, json
          secrets = json.loads(os.environ.get('ALL_SECRETS','{}'))
          prefixes = ('GROQ_API_KEY', 'GEMINI_API_KEY', 'PEXELS_API_KEY', 'PIXABAY_API_KEY', 'SAMBANOVA_API_KEY', 'NINEROUTER')
          explicit = {
              'ELEVENLABS_API_KEYS', 'CLOUDFLARE_ACCOUNT_ID', 'CLOUDFLARE_API_TOKEN',
              'TOKEN_B64', 'CLIENT_SECRET_B64', 'PAT_TOKEN', 'PEXELS_API_KEY', 'PIXABAY_API_KEY', 'SAMBANOVA_API_KEY',
              'NINEROUTER_API_KEY', 'NINEROUTER_KEY', 'NINEROUTER_URL', 'OMNIROUTE_API_KEY', 'SHELLSHOCK_URL', 'SHELLSHOCK_API_KEY'
          }
          with open('.env', 'w') as f:
              for k, v in secrets.items():
                  if any(k.startswith(p) for p in prefixes) or k in explicit:
                      v_escaped = v.replace('\n','\\n') if isinstance(v, str) else str(v)
                      f.write(f'{k}="{v_escaped}"\n')
          print('Wrote .env file successfully')
          PY

      - name: Download Assets Bundle from Stage 1
        uses: actions/download-artifact@v4
        with:
          name: documentary-assets-bundle
          path: output

      - name: Run Stage 2 (Render 16:9 Video, Dubbing, YouTube Upload)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_PROVIDER: groq
        run: |
          ARGS="--bundle-zip output/bundle.zip"
          if [ "${{ inputs.upload_to_youtube }}" != "true" ]; then
            ARGS="$ARGS --no-upload"
          fi
          if [ "${{ inputs.enable_dubbing }}" != "true" ]; then
            ARGS="$ARGS --no-dub"
          fi
          if [ -n "${{ inputs.dub_lang }}" ]; then
            ARGS="$ARGS --dub-lang ${{ inputs.dub_lang }}"
          fi
          echo "Executing Stage 2: python -m src.stage2_render $ARGS"
          python -m src.stage2_render $ARGS

      - name: Commit state.json and outputs
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "state.json unchanged"
          else
            git commit -m "auto: update state.json after documentary run"
            git pull --rebase --autostash
            git push
          fi
